[package]
name = "shiori_client"
version = "0.1.0"
edition = "2021"
description = "詩織のサーバーに話しかける側の部品(shiori-save・shiori-task・mcp_serverが共有する)。Tauriに依存しない"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"
