[package]
name = "library_store"
version = "0.1.0"
edition = "2021"
description = "詩織のlibraryへの書き込みを1か所に集める部品(Tauriに依存しない。アプリ・CLI・サーバーが共有する)"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
chrono = "0.4"
unicode-normalization = "0.1.26"
regex = "1"

[dev-dependencies]
tempfile = "3"
