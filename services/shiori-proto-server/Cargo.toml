[package]
name = "shiori-proto-server"
version = "0.1.0"
edition = "2021"
description = "詩織Ver7.0 Phase 0の試作。サーバー側の窓口の最小版と、AIから窓口を呼ぶ中継(mcp_relay)"

[[bin]]
name = "shiori-proto-server"
path = "src/main.rs"

[[bin]]
name = "mcp_relay"
path = "src/bin/mcp_relay.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
getrandom = "0.2"
rmcp = { version = "3", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
ureq = { version = "2", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = false
lto = true
codegen-units = 1
strip = true
